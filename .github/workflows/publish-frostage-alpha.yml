name: Publish FrostAge alpha release

on:
  push:
    branches: [main]
    paths:
      - '.github/release-intents/frostage-alpha-2026-11-13.md'

permissions:
  contents: write

jobs:
  publish-frostage-alpha:
    if: github.repository == 'DemusOpalium/dark-snake-game'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install locked Windows dependencies
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r requirements-windows-build.txt

      - name: Compile and run full test suite
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m compileall -q Dark_Snake tests
          python scripts/frostage_catalog.py --check
          python -m pytest -q

      - name: Build unsigned Windows EXE
        env:
          PYTHONHASHSEED: '0'
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          Set-Content -LiteralPath build-commit.txt -Value $env:GITHUB_SHA -Encoding ascii
          python -m PyInstaller --onefile --windowed --version-file scripts/windows_version_info.txt --hidden-import developer_simulator --add-data "Dark_Snake/assets;assets" --add-data "Dark_Snake/modules;modules" --add-data "build-commit.txt;." Dark_Snake/main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }

      - name: Verify bundled FrostAge images
        shell: pwsh
        run: |
          python scripts/check_frostage_exe.py dist/main.exe
          if ($LASTEXITCODE -ne 0) { throw 'FrostAge asset verification failed' }

      - name: Package release ZIP and check checksum
        shell: pwsh
        run: |
          $zip = 'dist/DARK-Snake-v1.0.0-Windows-x64.zip'
          python scripts/package_windows.py dist/main.exe $zip --source-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'ZIP packaging failed' }
          $checksumLine = (Get-Content -LiteralPath "$zip.sha256" -Raw).Trim()
          $expected = ($checksumLine -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($expected.ToUpperInvariant() -ne $actual.ToUpperInvariant()) {
            throw 'Release ZIP checksum mismatch'
          }

      - name: Publish bilingual prerelease with permanent ZIP assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'frostage-alpha-2026-11-13'
          $zip = 'dist/DARK-Snake-v1.0.0-Windows-x64.zip'
          gh release view $tag --json id *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists. No overwrite performed.'
            exit 0
          }
          $releaseArgs = @(
            $tag,
            $zip,
            "$zip.sha256",
            '--target', $env:GITHUB_SHA,
            '--title', 'DARK SNAKE - FrostAge Alpha | 13 November 2026',
            '--notes-file', '.github/release-intents/frostage-alpha-2026-11-13.md',
            '--prerelease'
          )
          & gh release create @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
