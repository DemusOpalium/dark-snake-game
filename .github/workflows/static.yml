# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify Pages input
        shell: bash
        run: |
          test -f site/index.html || { echo "::error::Missing site/index.html"; exit 1; }
          echo "Publishing site/, not the entire game repository."
      - name: Validate website markup, media and links
        run: |
          python -c "import runpy; p=runpy.run_path('tests/test_site_presentation.py'); p['test_pages_contract_and_links'](); p['test_all_web_media_are_tracked_and_pngs']()"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only publish the authored static site. The old '.' uploaded
          # ~310 MB of Windows/game assets to Pages on every merge.
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
