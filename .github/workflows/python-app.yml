name: Windows Alpha 2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Keep this job name stable: branch protection requires the "main" check.
  main:
    name: main
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List repository files
        shell: cmd
        run: dir /s /B

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Compile and test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python tests/check_conflict_markers.py
          python -m compileall -q Dark_Snake tests
          python -m pytest -q

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --add-data "Dark_Snake/assets;assets" --add-data "Dark_Snake/modules;modules" Dark_Snake/main.py

      - name: Verify EXE file exists
        shell: bash
        run: |
          if [ -f dist/main.exe ]; then
            echo "File exists."
          else
            echo "File does not exist."
            exit 1
          fi

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dark-snake-exe
          path: dist/main.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: false
          include-hidden-files: false
