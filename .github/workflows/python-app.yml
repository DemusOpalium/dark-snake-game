name: Windows Alpha 2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # Keep this job name stable: branch protection requires the "main" check.
  main:
    name: main
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r requirements-windows-build.txt

      - name: Compile and test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m compileall -q Dark_Snake tests
          python -m pytest -q

      - name: Build EXE with PyInstaller
        env:
          PYTHONHASHSEED: '0'
        run: |
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          python -m PyInstaller --onefile --windowed --version-file scripts/windows_version_info.txt --hidden-import developer_simulator --add-data "Dark_Snake/assets;assets" --add-data "Dark_Snake/modules;modules" Dark_Snake/main.py

      - name: Verify EXE identity fields
        run: |
          $info = (Get-Item -LiteralPath dist/main.exe -ErrorAction Stop).VersionInfo
          if ($info.ProductName -ne 'DARK Snake' -or $info.CompanyName -ne 'DemusOpalium' -or
              $info.ProductVersion -ne '1.0.0' -or $info.FileVersion -ne '1.0.0.0' -or
              $info.LegalCopyright -ne 'Copyright (c) 2025 DemusOpalium') {
            throw 'Unexpected Windows version information'
          }
          Get-AuthenticodeSignature -FilePath dist/main.exe | Select-Object Status

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dark-snake-exe
          path: dist/main.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Package Windows release ZIP
        run: python scripts/package_windows.py dist/main.exe dist/DARK-Snake-v1.0.0-Windows-x64.zip --source-commit $env:GITHUB_SHA

      - name: Upload Windows release ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dark-snake-windows-zip
          path: |
            dist/DARK-Snake-v1.0.0-Windows-x64.zip
            dist/DARK-Snake-v1.0.0-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
